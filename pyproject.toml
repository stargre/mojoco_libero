[build-system]
requires = ["setuptools>=65,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-libero-saycan"
version = "0.1.0"
description = "LIBERO MuJoCo environment adapter for SayCan research"
readme = "README.md"
requires-python = ">=3.8,<3.9"
dependencies = [
  "numpy==1.22.4",
  "PyYAML==6.0.1",
  "imageio==2.35.1",
  "imageio-ffmpeg==0.5.1",
  "openai==1.55.3",
]

[tool.setuptools.packages.find]
include = ["libero_saycan*"]
